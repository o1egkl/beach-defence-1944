<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2a3322"/>
      <stop offset="60%" stop-color="#141810"/>
      <stop offset="100%" stop-color="#090c07"/>
    </radialGradient>

    <!-- Metal Armor Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#525c48"/>
      <stop offset="50%" stop-color="#384230"/>
      <stop offset="100%" stop-color="#1e2419"/>
    </linearGradient>

    <!-- Brass Gradient -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#f5d061"/>
      <stop offset="40%" stop-color="#d99b26"/>
      <stop offset="100%" stop-color="#8a5a0d"/>
    </linearGradient>

    <!-- Barrel Steel Gradient -->
    <linearGradient id="barrelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="35%" stop-color="#71717a"/>
      <stop offset="70%" stop-color="#52525b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#3f4a33" stroke-width="8"/>
  <rect x="32" y="32" width="448" height="448" rx="80" fill="none" stroke="url(#brassGrad)" stroke-width="3" opacity="0.6"/>

  <!-- Rivets around border -->
  <g fill="#27272a" stroke="#52525b" stroke-width="2">
    <circle cx="64" cy="64" r="7"/>
    <circle cx="256" cy="48" r="7"/>
    <circle cx="448" cy="64" r="7"/>
    <circle cx="48" cy="256" r="7"/>
    <circle cx="464" cy="256" r="7"/>
    <circle cx="64" cy="448" r="7"/>
    <circle cx="256" cy="464" r="7"/>
    <circle cx="448" cy="448" r="7"/>
  </g>

  <!-- Concrete Bunker Pillbox -->
  <g filter="url(#shadow)">
    <!-- Bunker Structure -->
    <path d="M 80,360 L 120,200 L 392,200 L 432,360 L 380,410 L 132,410 Z" fill="url(#metalGrad)" stroke="#1a2015" stroke-width="6"/>

    <!-- Slanted Bunker Roof -->
    <path d="M 120,200 L 160,140 L 352,140 L 392,200 Z" fill="#2d3725" stroke="#151b10" stroke-width="5"/>

    <!-- Heavy Coastal Cannon Barrels -->
    <!-- Left Barrel -->
    <rect x="222" y="60" width="22" height="150" rx="4" fill="url(#barrelGrad)" stroke="#18181b" stroke-width="3"/>
    <rect x="216" y="52" width="34" height="20" rx="2" fill="url(#barrelGrad)" stroke="#09090b" stroke-width="2"/>
    <rect x="220" y="90" width="26" height="8" fill="#18181b"/>
    <rect x="220" y="120" width="26" height="8" fill="#18181b"/>

    <!-- Right Barrel -->
    <rect x="268" y="60" width="22" height="150" rx="4" fill="url(#barrelGrad)" stroke="#18181b" stroke-width="3"/>
    <rect x="262" y="52" width="34" height="20" rx="2" fill="url(#barrelGrad)" stroke="#09090b" stroke-width="2"/>
    <rect x="266" y="90" width="26" height="8" fill="#18181b"/>
    <rect x="266" y="120" width="26" height="8" fill="#18181b"/>

    <!-- Bunker Embrasure Slot (Firing Slit) -->
    <rect x="150" y="235" width="212" height="52" rx="10" fill="#080b06" stroke="#181c14" stroke-width="6"/>

    <!-- Mantlet Plate inside Embrasure -->
    <rect x="200" y="242" width="112" height="38" rx="6" fill="#1f2619" stroke="#3b4632" stroke-width="3"/>
  </g>

  <!-- Targeting Reticle Overlay -->
  <g filter="url(#glow)">
    <!-- Outer Crosshair Ring -->
    <circle cx="256" cy="256" r="140" fill="none" stroke="url(#brassGrad)" stroke-width="3.5" stroke-dasharray="14 10" opacity="0.85"/>
    <circle cx="256" cy="256" r="70" fill="none" stroke="url(#brassGrad)" stroke-width="2.5" opacity="0.9"/>

    <!-- Crosshair Ticks -->
    <line x1="256" y1="100" x2="256" y2="150" stroke="url(#brassGrad)" stroke-width="4"/>
    <line x1="256" y1="362" x2="256" y2="412" stroke="url(#brassGrad)" stroke-width="4"/>
    <line x1="100" y1="256" x2="150" y2="256" stroke="url(#brassGrad)" stroke-width="4"/>
    <line x1="362" y1="256" x2="412" y2="256" stroke="url(#brassGrad)" stroke-width="4"/>

    <!-- Center Aim Pip -->
    <circle cx="256" cy="256" r="8" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Banner: 1944 -->
  <g filter="url(#shadow)">
    <rect x="166" y="420" width="180" height="42" rx="8" fill="#141810" stroke="url(#brassGrad)" stroke-width="3"/>
    <text x="256" y="450" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="url(#brassGrad)" text-anchor="middle" letter-spacing="4">1944</text>
  </g>

  <!-- Corner Chevrons -->
  <path d="M 70,110 L 110,70" stroke="url(#brassGrad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 442,110 L 402,70" stroke="url(#brassGrad)" stroke-width="4" stroke-linecap="round"/>
</svg>
