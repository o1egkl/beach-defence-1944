name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Pacific Defence APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure gradlew permissions
        run: |
          chmod +x android/gradlew
          chmod -R +x android/gradle/wrapper

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install npm dependencies
        run: npm install --include=dev

      - name: Build web assets and sync Capacitor
        run: |
          node scripts/prepare-android.js
          npx --yes @capacitor/cli copy android
          npx --yes @capacitor/cli update android

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          APK_PATH=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" build-output/Pacific-Defence.apk
          cp "$APK_PATH" build-output/Pacific-Defence-1.1.0.apk
          ls -lh build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pacific-Defence-APK
          path: build-output/Pacific-Defence.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release v1.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.1.0 build-output/Pacific-Defence.apk build-output/Pacific-Defence-1.1.0.apk --clobber || echo "Release upload skipped or failed, artifact is preserved in workflow run."
